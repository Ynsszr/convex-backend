# Focused transport/worker checks can run without downloading or building V8,
# cloud adapters, search engines or the backend's optional test dependencies.
[workspace]

[package]
name = "dotnet_executor_proof"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[lib]
name = "dotnet_executor"
path = "../src/lib.rs"

[[example]]
name = "native_worker"
path = "../examples/native_worker.rs"

[features]
default = ["transport-proof"]
transport-proof = []

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
tempfile = "3"
