[package]
name = "dotnet_executor"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[features]
# The independent transport proof compiles this library without the backend's
# telemetry dependency graph. Backend builds always retain telemetry by default.
transport-proof = []

