name: Native FSharp package preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dotnet/**"
      - "crates/dotnet_executor/**"
      - "crates/application/**"
      - "crates/function_runner/**"
      - "crates/isolate/**"
      - "crates/local_backend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain"
      - "Convex.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/actions/setup-native-sandbox/**"
      - ".github/workflows/dotnet-preview.yml"
      - ".github/workflows/build_local_backend.yml"
permissions:
  contents: read
jobs:
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-native-sandbox
      - name: Setup the pinned Rust toolchain
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - name: Cache standalone native executor proof
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/dotnet_executor/proof/target
          key:
            native-proof-${{ runner.os }}-${{ hashFiles('rust-toolchain',
            '.cargo/config.toml', 'crates/dotnet_executor/proof/Cargo.lock') }}
      - name: Execute Rust native executor proof tests
        # This standalone manifest exercises the actual executor source without
        # building V8 or unrelated backend test binaries on a hosted runner.
        run:
          cargo test --manifest-path crates/dotnet_executor/proof/Cargo.toml
          --locked
      - name: Managed SDK and development tests
        run: |
          dotnet test dotnet/FSharp/tests/Convex.FSharp.Tests/Convex.FSharp.Tests.fsproj -c Release
          dotnet test dotnet/Execution/tests/Convex.DotNet.Tests/Convex.DotNet.Tests.fsproj -c Release
          dotnet test dotnet/Execution/tests/Convex.Development.Tests/Convex.Development.Tests.fsproj -c Release
          dotnet test dotnet/Client/tests/Convex.Client.Tests/Convex.Client.Tests.fsproj -c Release
      - name: Produce local packages
        run:
          dotnet fsi dotnet/tools/Release.fsx packages
          "$RUNNER_TEMP/convex-feed"
      - name: Check independent package consumer
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          dotnet fsi dotnet/tools/CheckConsumer.fsx "$RUNNER_TEMP/convex-feed" "$VERSION" "$RUNNER_TEMP/convex-consumer"
          dotnet fsi dotnet/tools/CheckGraphConsumer.fsx "$RUNNER_TEMP/convex-feed" "$VERSION" "$RUNNER_TEMP/convex-graph-consumer"
