name: Build Convex Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Convex Backend
    runs-on: [self-hosted, aws, x64, xlarge]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET for native backend acceptance
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup restricted native worker sandbox
        # The AWS runner image must meet the Ubuntu 24.04+ sandbox baseline.
        # Keep acceptance on this large runner, sharing its Rust/JS build cache.
        uses: ./.github/actions/setup-native-sandbox

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Check Cargo.lock up-to-date
        run: cargo update -w --locked

      # Restore-only: OSS can't write this cache (cache-write role is get-convex/convex-only).
      - name: Restore pnpm artifacts
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUNS_ON_S3_BUCKET_CACHE: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
        with:
          path: |
            ~/.local/share/pnpm/store
            npm-packages/.turbo/cache
          key: pnpm-cache-${{ hashFiles('npm-packages/pnpm-lock.yaml') }}-3
          restore-keys: pnpm-cache-

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM install globals
        run: npm ci --prefix scripts

      - name: Build JS required by Isolate
        run: |
          just install-js
          just turbo run build --filter=component-tests... --filter=convex... --filter=system-udfs... --filter=udf-runtime... --filter=udf-tests...

      - name: Install cargo-nextest
        uses: taiki-e/install-action@481c34c1cf3a84c68b5e46f4eccfc82af798415a # v2
        with:
          tool: cargo-nextest

      - name: Build rust tests
        run: cargo nextest run --no-run --profile ci

      - name: Build native fork backend executable
        run: cargo build --locked -p local_backend --bin convex-local-backend

      - name: Build native acceptance fixture and host
        run: |
          dotnet build dotnet/Execution/tests/RuntimeFixture/RuntimeFixture.fsproj -c Release
          dotnet build dotnet/Execution/src/Convex.DotNet.Host/Convex.DotNet.Host.fsproj -c Release
          dotnet build dotnet/Execution/tests/NativeBackendAcceptance/NativeBackendAcceptance.fsproj -c Release

      - name: Execute native live backend acceptance
        timeout-minutes: 15
        run: |
          dotnet dotnet/Execution/tests/NativeBackendAcceptance/bin/Release/net10.0/NativeBackendAcceptance.dll \
            "$GITHUB_WORKSPACE/target/debug/convex-local-backend" \
            "$RUNNER_TEMP/convex-native-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$GITHUB_WORKSPACE/dotnet/Execution/src/Convex.DotNet.Host/bin/Release/net10.0"

      - name: Retain native acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-acceptance
          # Retain the bounded result, not the generated credentials/database.
          path:
            ${{ runner.temp }}/convex-native-acceptance-${{ github.run_id }}-${{
            github.run_attempt }}/result.json
          if-no-files-found: warn
          retention-days: 7
